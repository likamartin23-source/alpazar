<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ALPAZAR — Jo Lidhje</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:32px 24px;text-align:center;max-width:320px;width:100%;}
.icon{font-size:56px;margin-bottom:16px;}
h1{color:#F5C842;font-size:20px;font-weight:700;margin-bottom:10px;}
p{color:#888;font-size:13px;line-height:1.6;margin-bottom:20px;}
.btn{display:inline-block;background:#E63312;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;}
.brand{color:#F5C842;font-size:11px;font-weight:700;letter-spacing:2px;margin-top:20px;opacity:.5;}
</style>
</head>
<body>
<div class="box">
  <div class="icon"><img src="/icons/eagle.svg" alt="" style="height:64px" /></div>
  <h1>Nuk ka lidhje interneti</h1>
  <p>Kontrollo lidhjen tënde dhe provo përsëri. ALPAZAR kërkon internet për të shfaqur shpalljet.</p>
  <button class="btn" onclick="location.reload()">🔄 Provo Përsëri</button>
  <div class="brand">ALPAZAR</div>
</div>
</body>
</html>
