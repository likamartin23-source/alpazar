<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="flapTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C28E"/>
      <stop offset="100%" stop-color="#D9A361"/>
    </linearGradient>
    <linearGradient id="flapSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B57E"/>
      <stop offset="100%" stop-color="#CE9550"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e3c1c"/>
      <stop offset="100%" stop-color="#794d24"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Ground shadow under the box -->
  <ellipse cx="256" cy="430" rx="170" ry="34" fill="#000" opacity="0.45" filter="url(#soft)"/>

  <!-- ===== Open box flaps (folded outward, top-down view) ===== -->
  <!-- Top flap -->
  <polygon points="148,148 364,148 392,62 120,62" fill="url(#flapTop)" stroke="#A6743A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bottom flap -->
  <polygon points="148,364 364,364 392,450 120,450" fill="url(#flapTop)" stroke="#A6743A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left flap -->
  <polygon points="148,148 148,364 62,392 62,120" fill="url(#flapSide)" stroke="#A6743A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right flap -->
  <polygon points="364,148 364,364 450,392 450,120" fill="url(#flapSide)" stroke="#A6743A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Flap crease lines (where they fold) -->
  <line x1="148" y1="148" x2="364" y2="148" stroke="#B07E44" stroke-width="2" opacity="0.6"/>
  <line x1="148" y1="364" x2="364" y2="364" stroke="#B07E44" stroke-width="2" opacity="0.6"/>
  <line x1="148" y1="148" x2="148" y2="364" stroke="#B07E44" stroke-width="2" opacity="0.6"/>
  <line x1="364" y1="148" x2="364" y2="364" stroke="#B07E44" stroke-width="2" opacity="0.6"/>

  <!-- Box interior walls (depth) -->
  <rect x="148" y="148" width="216" height="216" rx="8" fill="url(#inner)"/>
  <!-- Inner wall shading on top + left for depth -->
  <rect x="148" y="148" width="216" height="216" rx="8" fill="#000" opacity="0.18"/>

  <!-- Recess seat / shadow for the flag panel -->
  <rect x="158" y="158" width="196" height="196" rx="16" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <image x="162" y="162" width="188" height="188" href="data:image/png;base64,"/>

  <!-- Subtle top highlight across the opening for gloss -->
  <rect x="162" y="162" width="188" height="60" rx="14" fill="#fff" opacity="0.05"/>
</svg>
