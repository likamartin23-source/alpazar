name: Apliko nje patch te verifikuar

# Perse ekziston: skedaret e medhenj te kesaj repoje (ListingPageClient.tsx 78 KB,
# HomeClient.tsx 54 KB) nuk kalojne dot te plote nga sesioni i agjentit.
#
# Dy provat e para deshtuan te i njejti mur: kanali i shkrimit e pret ngarkesen
# rreth 19,4 KB. E para si `workflow_dispatch` input (`base64: invalid input`),
# e dyta si nje skedar i vetem (mberriti 19 429 bajt nga 22 256).
#
# Zgjidhja: patch-i vjen i ndare ne pjese TEKSTI nen ate kufi, te bashkuara
# ketu. Rreshtat qe nisin me `#` jane shenime dhe hiqen. Shuma `sha256` eshte
# porta: nese ndonje pjese mberrin e cunguar, hapi bie me nje mesazh te qarte
# ne vend qe patch-i te aplikohet gjysmak.
#
# Sekuenca: bashko → verifiko → apliko → `tsc` → teste → `next build` → dege.
# Nese ndonje porte bie, dega nuk krijohet fare.

on:
  workflow_dispatch:
    inputs:
      pjeset:
        description: 'Model shell-i qe kap pjeset, sipas radhes'
        required: true
        default: '.github/patches/p-*.txt'
      sha256:
        description: 'sha256 i patch-it TE DEKOMPRESUAR'
        required: true
      dega:
        description: 'Emri i deges se re'
        required: true
        default: 'feature/interlink-harmonize'
      mesazhi:
        description: 'Titulli i commit-it'
        required: true

permissions:
  contents: write

jobs:
  apliko:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bashko pjeset dhe verifiko shumen
        run: |
          echo "Pjeset e gjetura:"
          ls -l ${{ inputs.pjeset }}
          cat ${{ inputs.pjeset }} | grep -v '^#' | tr -d '\n' \
            | base64 -d | gunzip -c > /tmp/nderhyrje.patch
          echo "Madhesia e patch-it: $(wc -c < /tmp/nderhyrje.patch) bajt"
          echo "${{ inputs.sha256 }}  /tmp/nderhyrje.patch" | sha256sum -c -

      - name: Apliko patch-in
        run: |
          git apply --check --whitespace=nowarn /tmp/nderhyrje.patch
          git apply --whitespace=nowarn /tmp/nderhyrje.patch
          echo "Skedaret e prekur:"
          git status --porcelain | sed 's/^/  /'

      - run: npm ci

      - name: Kontroll tipesh
        run: npx tsc --noEmit

      - name: Testet
        run: npm run test

      - name: Ndertimi
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Krijo degen
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "${{ inputs.dega }}"
          # Pjeset jane mjet transporti, jo kod — hiqen qe te mos mbeten ne dege.
          git rm -q ${{ inputs.pjeset }}
          git add -A
          git commit -m "${{ inputs.mesazhi }}"
          git push -u origin "${{ inputs.dega }}"
