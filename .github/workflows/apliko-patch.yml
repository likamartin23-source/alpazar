name: Apliko nje patch te verifikuar

# Perse ekziston: skedaret e medhenj te kesaj repoje (ListingPageClient.tsx 78 KB,
# HomeClient.tsx 54 KB) nuk kalojne dot te plote nga sesioni i agjentit.
#
# Kanali i shkrimit eshte i humbshem ne dy menyra, te dyja te matura:
#   1. SHKURTON mbi ~19,4 KB (nje skedar 22 256 bajt mberriti 19 429).
#   2. NDERRON ndonje bajt te vetem edhe kur gjatesia del e sakte.
#
# Prandaj: ngarkesa vjen ne pjese teksti nen kufi, me korrigjimet e matura te
# dhena si `riparime`, dhe `sha256` si porte e vetme qe i kap te dyja. Rreshtat
# qe nisin me `#` jane shenime dhe hiqen gjate bashkimit.
#
# Sekuenca: sill pjeset → riparo → bashko → verifiko → apliko → tsc → teste →
# build → dege. Nese ndonje porte bie, dega nuk preket fare.
#
# `baza`: dega/ref mbi te cilen aplikohet patch-i (default main). Kjo lejon
# grumbullimin e fazave njera mbi tjetren (p.sh. §1B mbi Fazen 1) pa i bashkuar
# ne nje commit te vetem. Pjeset e transportit rrojne gjithmone ne `main`;
# kodi aplikohet mbi `baza`. `fetch-depth: 0` i jep klientit historine e plote
# qe push-i te provoje fast-forward-in edhe kur dega ekziston.

on:
  workflow_dispatch:
    inputs:
      pjeset:
        description: 'Model shell-i qe kap pjeset, sipas radhes'
        required: true
        default: '.github/patches/p-*.txt'
      riparime:
        description: 'Korrigjime bajtesh: skedar:pozicion:karakter, ndare me presje (1-indeksuar)'
        required: false
        default: ''
      sha256:
        description: 'sha256 i patch-it TE DEKOMPRESUAR'
        required: true
      baza:
        description: 'Dega/ref mbi te cilen aplikohet patch-i'
        required: true
        default: 'main'
      dega:
        description: 'Emri i deges qe krijohet/perditesohet'
        required: true
        default: 'feature/interlink-harmonize'
      mesazhi:
        description: 'Titulli i commit-it'
        required: true

permissions:
  contents: write

jobs:
  apliko:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baza }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sill pjeset e transportit nga origin/main
        run: |
          git fetch origin main
          git checkout origin/main -- ${{ inputs.pjeset }}

      - name: Ripare bajtet e nderruar
        if: inputs.riparime != ''
        env:
          RIPARIME: ${{ inputs.riparime }}
          RRENJA: .github/patches
        run: |
          python3 - <<'PY'
          import os, pathlib
          rrenja = pathlib.Path(os.environ['RRENJA'])
          for pjesa in os.environ['RIPARIME'].split(','):
              pjesa = pjesa.strip()
              if not pjesa:
                  continue
              emri, poz, karakter = pjesa.split(':')
              i = int(poz) - 1                      # inputi eshte 1-indeksuar
              p = rrenja / emri
              b = bytearray(p.read_bytes())
              vjeter = chr(b[i])
              b[i] = ord(karakter)
              p.write_bytes(bytes(b))
              print(f"{emri} @{poz}: {vjeter!r} -> {karakter!r}")
          PY

      - name: Bashko pjeset dhe verifiko shumen
        run: |
          echo "Pjeset e gjetura:"
          ls -l ${{ inputs.pjeset }}
          cat ${{ inputs.pjeset }} | grep -v '^#' | tr -d '\n' \
            | base64 -d | gunzip -c > /tmp/nderhyrje.patch
          echo "Madhesia e patch-it: $(wc -c < /tmp/nderhyrje.patch) bajt"
          echo "${{ inputs.sha256 }}  /tmp/nderhyrje.patch" | sha256sum -c -

      - name: Hiq pjeset e transportit para aplikimit
        # Pjeset jane mjet transporti, jo kod — s'duhet te mbeten ne dege.
        run: |
          git rm -q --cached ${{ inputs.pjeset }} 2>/dev/null || true
          rm -f ${{ inputs.pjeset }} 2>/dev/null || true

      - name: Apliko patch-in
        run: |
          # Patch-i mund te mbaje nje kopje te vjeteruar te ketij workflow-i, sepse
          # u nxor nga nje peme pune ku edhe ai ishte i ndryshuar. Makineria e
          # transportit administrohet vec nga kodi.
          APLIKO="--whitespace=nowarn --exclude=.github/workflows/*"
          git apply --check $APLIKO /tmp/nderhyrje.patch
          git apply $APLIKO /tmp/nderhyrje.patch
          echo "Skedaret e prekur:"
          git status --porcelain | sed 's/^/  /'

      - run: npm ci

      - name: Kontroll tipesh
        run: npx tsc --noEmit

      - name: Testet
        run: npm run test

      - name: Ndertimi
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Krijo/perditeso degen
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "${{ inputs.dega }}"
          git add -A
          git commit -m "${{ inputs.mesazhi }}"
          git push -u origin "${{ inputs.dega }}"
