name: Setup Vercel Environment Variables

# Run manually once to set required env vars on Vercel.
# Requires VERCEL_TOKEN GitHub Secret.
# Usage: GitHub → Actions → "Setup Vercel Environment Variables" → Run workflow

on:
  workflow_dispatch:
    inputs:
      supabase_service_role_key:
        description: 'SUPABASE_SERVICE_ROLE_KEY (from Supabase Dashboard → Settings → API)'
        required: true
        type: string
      admin_pin:
        description: 'ADMIN_PIN — 6-digit admin panel PIN (server-side only)'
        required: true
        type: string
        default: '123456'

permissions:
  contents: read

jobs:
  set-env-vars:
    name: Set Vercel Env Vars
    runs-on: ubuntu-latest

    steps:
      - name: Set SUPABASE_SERVICE_ROLE_KEY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X POST "https://api.vercel.com/v10/projects/prj_KNCEtuUDGNCA6ulHomdKniNAZEuX/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "SUPABASE_SERVICE_ROLE_KEY",
              "value": "${{ inputs.supabase_service_role_key }}",
              "type": "encrypted",
              "target": ["production", "preview"]
            }' | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK:', d.get('key','?')) if 'key' in d else print('Error:', d)"

      - name: Set ADMIN_PIN (server-side)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X POST "https://api.vercel.com/v10/projects/prj_KNCEtuUDGNCA6ulHomdKniNAZEuX/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "ADMIN_PIN",
              "value": "${{ inputs.admin_pin }}",
              "type": "encrypted",
              "target": ["production", "preview"]
            }' | python3 -c "import json,sys; d=json.load(sys.stdin); print('OK:', d.get('key','?')) if 'key' in d else print('Error:', d)"

      - name: Summary
        run: |
          echo "✅ Env vars set on Vercel project prj_KNCEtuUDGNCA6ulHomdKniNAZEuX"
          echo ""
          echo "Note: CRON_SECRET is auto-set by Vercel for projects with cron jobs."
          echo "      No manual action needed for CRON_SECRET."
          echo ""
          echo "Next: Trigger a Vercel redeploy to pick up the new env vars."
          echo "      Push any commit to main or use: Vercel Dashboard → Deployments → Redeploy"
