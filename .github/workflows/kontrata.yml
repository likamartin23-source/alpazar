name: Kontrata kod↔DB (porte CI)

# Faza 5 e harnesit (Cowork §5.B/§10.4): bllokon merge-in kur kodi referon
# nje kolone/tabele qe DB-ja s'e ka me. Perdor vetem anon-key publik (pa sekrete).
# Per bllokim te vertete te merge-it, aktivizo "required status check" ne branch
# protection te main (e ben pronari nje here ne GitHub Settings).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kontrata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verifiko kontraten kod↔DB
        run: node scripts/kontrata-db.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
