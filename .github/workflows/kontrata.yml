name: Kontrata kod ↔ bazë

# Pse: TypeScript-i nuk e kap dot nje '.rpc("emer_qe_nuk_ekziston")' ose nje
# funksion baze qe i referohet nje kolone te fshire. Ato dalin vetem kur nje
# perdorues real i ndesh — dhe atehere eshte vone. Ky kontroll i kap ketu.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # cdo mengjes ne 06:00 UTC — kap edhe ndryshimet e bera drejtpersedrejti ne baze
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  kontrata:
    name: Referencat kod ↔ bazë
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verifiko kontraten
        run: node scripts/kontroll-kontrate.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://sopafwfkrxpcdaljddoh.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Njofto ne Slack nese kontrata u thye
        if: failure() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "::notice::SLACK_WEBHOOK_URL mungon — anashkalohet."; exit 0; }
          payload=$(jq -nc '{text:"🔴 *Kontrata kod↔bazë u thye* — ka referenca qe nuk ekzistojne. Shiko CI."}')
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload" >/dev/null
