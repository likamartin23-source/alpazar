name: Deploy → Vercel Production

# Vendosja automatike behet nga integrimi natyv i Vercel-it me GitHub.
# Ky workflow eshte rruga e shpetimit: kur ai nderpritet, e nis me dore.
#
# GABIMI I MEPARSHEM: kushtet ishin shkruar si
#     if: env.VERCEL_DEPLOY_HOOK != ''
# por konteksti `env` i nje hapi NUK lexohet brenda `if:` te atij hapi.
# Prandaj te dyja deget e vendosjes ishin gjithmone false dhe punonte vetem
# dega "nuk ka celesa" — pra ky workflow nuk ka vendosur kurre asgje.
# Zgjidhja: kushtet lexojne drejtperdrejt kontekstin `secrets`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, preview]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Vendosje me dore
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Nis vendosjen me deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Nis vendosjen për ${{ inputs.environment }}…"
          RESPONSE=$(curl -sS -X POST "$HOOK")
          echo "$RESPONSE"
          echo "Ndiqe te: https://vercel.com/personal-accaunt-s-projects/alpazar"

      - name: Vendosje me CLI (kur ka token)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK == '' && secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Kkg5W4qnF2t5CQZj64ZS8xbz
          VERCEL_PROJECT_ID: prj_KNCEtuUDGNCA6ulHomdKniNAZEuX
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=${{ inputs.environment }} --token=$VERCEL_TOKEN
          vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=$VERCEL_TOKEN
          vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=$VERCEL_TOKEN

      - name: Asnje celes i konfiguruar
        if: ${{ secrets.VERCEL_DEPLOY_HOOK == '' && secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "::error::As VERCEL_DEPLOY_HOOK dhe as VERCEL_TOKEN nuk jane vendosur."
          echo "Shtoji te Settings → Secrets and variables → Actions."
          exit 1

      - name: Verifiko qe prodhimi u perditesua
        if: success()
        run: |
          sleep 210
          node scripts/verifiko-live.mjs
        env:
          URL_PRODHIMI: ${{ vars.URL_PRODHIMI || 'https://alpazar.vercel.app' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOLERANCA_MIN: '20'
