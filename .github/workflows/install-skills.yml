name: Instalo skills nga nje burim i verifikuar

# Kontejneri i sesionit s'ka akses te github.com — vetem raw.githubusercontent.
# Ndaj shkarkimi behet ketu, ku runner-i e ka aksesin e plote.
#
# KUJDES: nje skill eshte nje skedar INSTRUKSIONESH qe agjenti i ndjek. Instalimi
# eshte siperfaqe sulmi (prompt injection / exfiltrim sekretesh), ndaj:
#  - commit-i i burimit regjistrohet per gjurmueshmeri;
#  - cdo skedar skanohet per urdhera te dyshimte;
#  - skills tona ekzistuese nuk mbishkruhen kurre;
#  - rezultati kalon nga PR, jo push direkt.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo burim (owner/name)'
        required: true
        default: 'arnabbagxd/brand-building-skills'
        type: string
      subdir:
        description: 'Nendrejtoria me skills brenda repo-s'
        required: true
        default: 'skills'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SRC: ${{ inputs.repo }}
      SUB: ${{ inputs.subdir }}
      BRANCH: skills/instalim
    steps:
      - uses: actions/checkout@v4

      - name: Shkarko burimin
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$SRC.git" /tmp/src
          echo "SRC_SHA=$(git -C /tmp/src rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ ! -d "/tmp/src/$SUB" ]; then
            echo "::error::Nendrejtoria '$SUB' s'u gjet te $SRC"
            exit 1
          fi
          ls -1 "/tmp/src/$SUB" | head -40

      - name: Skano per prompt-injection dhe kerkesa sekretesh
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          root = pathlib.Path('/tmp/src') / os.environ['SUB']

          # Modele qe s'kane pse te dalin ne nje skill legjitim marketingu.
          RED = [
              (r'ignore (all |any )?previous instructions', 'anashkalim instruksionesh'),
              (r'disregard (the |your )?(system|previous)', 'anashkalim instruksionesh'),
              (r'\.env\b', 'referencë te .env'),
              (r'service_role', 'çelës service_role'),
              (r'ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN', 'emër sekreti'),
              (r'curl\s+[^|\n]*\|\s*(ba)?sh', 'curl | sh'),
              (r'base64\s+-d\s*\|', 'base64 -d | ...'),
              (r'~/\.ssh|id_rsa', 'çelësa SSH'),
          ]

          hits, files = [], 0
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              files += 1
              try:
                  txt = p.read_text(errors='replace')
              except Exception:
                  continue
              for pat, why in RED:
                  for m in re.finditer(pat, txt, re.I):
                      line = txt[:m.start()].count(chr(10)) + 1
                      hits.append(f"{p.relative_to(root)}:{line}  [{why}]  {m.group(0)!r}")

          print(f"U skanuan {files} skedare.")
          if hits:
              print('::error::Modele te dyshimta — instalimi ndalohet:')
              for h in hits[:50]:
                  print('  ' + h)
              sys.exit(1)
          print('OK: asnje model i dyshimte.')
          PY

      - name: Kopjo pa mbishkruar asgje tonen
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, sys

          src = pathlib.Path('/tmp/src') / os.environ['SUB']
          dst = pathlib.Path('.claude/skills')
          dst.mkdir(parents=True, exist_ok=True)

          existing = {d.name for d in dst.iterdir() if d.is_dir()}
          added, skipped, bad = [], [], []

          for d in sorted(src.iterdir()):
              if not d.is_dir():
                  continue
              skill = d / 'SKILL.md'
              if not skill.exists():
                  bad.append(f"{d.name}: s'ka SKILL.md")
                  continue
              head = skill.read_text(errors='replace')[:2000]
              if not head.lstrip().startswith('---') or 'name:' not in head or 'description:' not in head:
                  bad.append(f"{d.name}: frontmatter i pavlefshem")
                  continue
              if d.name in existing:
                  skipped.append(d.name)   # kurre mos mbishkruaj tonat
                  continue
              shutil.copytree(d, dst / d.name)
              added.append(d.name)

          print(f"Shtuar ({len(added)}): {', '.join(added) or '-'}")
          print(f"Anashkaluar sepse ekzistonin ({len(skipped)}): {', '.join(skipped) or '-'}")
          if bad:
              print('::error::Skills te keqformuara:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          if not added:
              print('::notice::Asgje e re per te shtuar.')
          PY

      - name: Shkruaj gjurmen e burimit
        run: |
          {
            echo "# Burimi i skills-eve te importuara"
            echo
            echo "Keto skills NUK jane shkruar nga ne. Jane importuar te pandryshuara"
            echo "nga nje burim i jashtem, me gjurmueshmeri te plote."
            echo
            echo "| Fusha | Vlera |"
            echo "|---|---|"
            echo "| Repo | \`$SRC\` |"
            echo "| Commit | \`$SRC_SHA\` |"
            echo "| Nendrejtoria | \`$SUB\` |"
            echo
            echo "## Pse ka rendesi"
            echo
            echo "Nje skill eshte nje skedar instruksionesh qe agjenti i ndjek. Cdo"
            echo "perditesim nga burimi duhet te ri-kaloje nga i njejti workflow"
            echo "(\`.github/workflows/install-skills.yml\`), i cili skanon per"
            echo "prompt-injection dhe per kerkesa sekretesh perpara kopjimit."
          } > .claude/skills/BURIMI.md

      - name: Dege + PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .claude/skills
          if git diff --cached --quiet; then
            echo "::notice::Asgje per te ndryshuar."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "skills: importo nga $SRC @ ${SRC_SHA:0:7}" -m "Importuar te pandryshuara pas skanimit per prompt-injection dhe kerkesa sekretesh. Skills tona ekzistuese nuk u prekën. Gjurma: .claude/skills/BURIMI.md"
          git push -u --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "skills: importo nga $SRC" --body "Importim automatik nga \`$SRC\` @ \`$SRC_SHA\`, pas skanimit per prompt-injection. Shih \`.claude/skills/BURIMI.md\`." || echo "::notice::PR ekziston tashme."
