name: Instalo skills nga burime te verifikuara

# Kontejneri i sesionit s'ka akses te github.com — vetem raw.githubusercontent.
# Ndaj shkarkimi behet ketu, ku runner-i e ka aksesin e plote.
#
# KUJDES: nje skill eshte nje skedar INSTRUKSIONESH qe agjenti i ndjek. Instalimi
# eshte siperfaqe sulmi (prompt injection / exfiltrim sekretesh), ndaj cdo skedar
# skanohet, skills tona nuk mbishkruhen kurre, dhe rezultati kalon nga PR.
#
# Dega eshte UNIKE per run: nje dege fikse mbijeton merge-et dhe e ben push-in
# te deshtoje heshtazi si "stale info".

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Nje rresht per repo: owner/repo  ose  owner/repo|nendrejtoria|prefiks'
        required: true
        type: string
      perjashtime:
        description: 'Perjashtime skanimi te shqyrtuara: nje rresht — emri-i-skillit|arsyeja'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Shkarko, skano dhe kopjo
        env:
          REPOS: ${{ inputs.repos }}
          PERJASHTIME: ${{ inputs.perjashtime }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess

          # Modele qe s'kane pse te dalin ne nje skill legjitim.
          RED = [
              (r'ignore (all |any )?previous instructions', 'anashkalim instruksionesh'),
              (r'disregard (the |your )?(system|previous)', 'anashkalim instruksionesh'),
              (r'service_role', 'celes service_role'),
              (r'ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN', 'emer sekreti'),
              (r'curl\s+[^|\n]*\|\s*(ba)?sh', 'curl | sh'),
              (r'base64\s+-d\s*\|', 'base64 -d |'),
              (r'~/\.ssh|id_rsa', 'celesa SSH'),
          ]

          # Sipas spec-it, keto e perbejne nje skill. Gjithcka tjeter ne repo
          # (teste, .github, dokumentacion) NUK eshte pjese e tij.
          SKILL_DIRS = ('references', 'scripts', 'assets', 'templates')

          # Skaneri eshte i trashe me qellim. Kur nje perputhje shqyrtohet me
          # dore dhe del e pademshme (p.sh. dokumentim i nje env var qe e kerkon
          # nje mjet i trete, jo yni), lejohet shprehimisht — dhe arsyeja mbetet
          # e shkruar te BURIMI.md. Asgje nuk kalon ne heshtje.
          EXC = {}
          for raw in os.environ.get('PERJASHTIME', '').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              k, _, why = line.partition('|')
              EXC[k.strip()] = why.strip() or 'pa arsye te dhene'

          dst = pathlib.Path('.claude/skills')
          dst.mkdir(parents=True, exist_ok=True)
          existing = {d.name for d in dst.iterdir() if d.is_dir()}

          report, provenance, waivers = [], [], []

          for raw in os.environ['REPOS'].splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              parts = [p.strip() for p in line.split('|')]
              src = parts[0]
              sub = parts[1] if len(parts) > 1 and parts[1] else '.'
              prefix = parts[2] if len(parts) > 2 else ''

              work = pathlib.Path('/tmp') / src.replace('/', '_')
              shutil.rmtree(work, ignore_errors=True)
              r = subprocess.run(['git', 'clone', '--depth', '1',
                                  f'https://github.com/{src}.git', str(work)],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  report.append(f"{src}: KLONIMI DESHTOI — {r.stderr.strip()[:120]}")
                  continue
              sha = subprocess.run(['git', '-C', str(work), 'rev-parse', 'HEAD'],
                                   capture_output=True, text=True).stdout.strip()
              shutil.rmtree(work / '.git', ignore_errors=True)

              root = (work / sub).resolve()
              if not root.exists():
                  report.append(f"{src}: nendrejtoria '{sub}' s'ekziston")
                  continue

              skills = sorted(root.rglob('SKILL.md'))
              if not skills:
                  report.append(f"{src}: asnje SKILL.md")
                  continue

              added, skipped, blocked, waived = [], [], [], []
              for skill in skills:
                  d = skill.parent
                  at_root = (d == root)
                  fallback = src.split('/')[-1] if at_root else d.name

                  head = skill.read_text(errors='replace')[:2000]
                  if not head.lstrip().startswith('---') or 'name:' not in head or 'description:' not in head:
                      blocked.append(f"{fallback} (frontmatter)")
                      continue

                  # Drejtoria duhet te mbaje emrin e skillit: Claude Code e gjen
                  # skillin nga drejtoria, jo nga frontmatter-i. Emri i repos-e
                  # nuk perputhet gjithmone — 'one-skill-to-rule-them-all'
                  # permban skillin 'task-observer'.
                  m = re.search(r'^name:[ \t]*([A-Za-z0-9._-]+)[ \t]*$', head, re.M)
                  name = m.group(1) if m else fallback
                  if prefix:
                      name = f"{prefix}-{name}"
                  if name in existing:
                      skipped.append(name)
                      continue

                  # Cfare e perben skillin. Kur SKILL.md rri ne rrenje, kjo NUK
                  # eshte krejt repoja — perndryshe testet e saj hyjne ne skanim
                  # dhe bllokojne skillin e vertete.
                  if at_root:
                      sources = [skill] + [d / p for p in SKILL_DIRS if (d / p).is_dir()]
                  else:
                      sources = [d]

                  files = []
                  for s in sources:
                      files.extend([f for f in s.rglob('*') if f.is_file()] if s.is_dir() else [s])

                  hits = []
                  for p in sorted(files):
                      try:
                          txt = p.read_text(errors='replace')
                      except Exception:
                          continue
                      for pat, why in RED:
                          m = re.search(pat, txt, re.I)
                          if m:
                              hits.append(f"{p.name} [{why}] {m.group(0)!r}")
                  if hits and name not in EXC:
                      blocked.append(f"{name} (skanimi: {hits[0]})")
                      continue
                  if hits:
                      waived.append(name)
                      waivers.append(f"`{name}` — {hits[0]} — lejuar: {EXC[name]}")

                  target = dst / name
                  target.mkdir(parents=True)
                  for s in sources:
                      if s.is_dir():
                          shutil.copytree(s, target / s.name)
                      else:
                          shutil.copy2(s, target / s.name)
                  existing.add(name)
                  added.append(f"{name} ({len(files)} skedare)")

              provenance.append((src, sha, sub))
              report.append(
                  f"{src} @ {sha[:7]}\n"
                  f"   shtuar   ({len(added)}): {', '.join(added) or '-'}\n"
                  f"   ekziston ({len(skipped)}): {', '.join(skipped) or '-'}\n"
                  f"   bllokuar ({len(blocked)}): {'; '.join(blocked) or '-'}\n"
                  f"   lejuar   ({len(waived)}): {', '.join(waived) or '-'}"
              )

          f = dst / 'BURIMI.md'
          if not f.exists():
              f.write_text(
                  '# Burimet e skills-eve te importuara\n\n'
                  'Keto skills NUK jane shkruar nga ne. Jane importuar te pandryshuara,\n'
                  'pas skanimit per prompt-injection dhe kerkesa sekretesh, permes\n'
                  '`.github/workflows/install-skills.yml`.\n\n'
                  '| Repo | Commit | Nendrejtoria |\n|---|---|---|\n')
          txt = f.read_text()
          for src, sha, sub in provenance:
              if sha not in txt:
                  txt += f"| `{src}` | `{sha}` | `{sub}` |\n"
          if waivers:
              if '## Perjashtime skanimi' not in txt:
                  txt += '\n## Perjashtime skanimi te shqyrtuara\n\n'
              for w in waivers:
                  if w not in txt:
                      txt += f"- {w}\n"
          f.write_text(txt)

          print('=' * 60)
          for r in report:
              print(r)
          print('=' * 60)
          PY

      - name: Dege + PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: skills/${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .claude/skills
          if git diff --cached --quiet; then
            echo "::notice::Asgje e re per te shtuar."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "skills: importo nga burime te verifikuara" -m "Pas skanimit per prompt-injection. Skills ekzistuese nuk u preken. Gjurma: .claude/skills/BURIMI.md"
          git push -u origin "$BRANCH"
          # `gh pr create` deshton gjithmone: token-i i Actions s'ka te drejte te
          # hapi PR ("GitHub Actions is not permitted to create or approve pull
          # requests"). Cdo run dilte i kuq vetem per kete. PR-ja hapet nga jashte.
          echo "::notice::Dega u shty. Hape PR-ne ketu: https://github.com/${{ github.repository }}/compare/main...$BRANCH"
