name: Instalo skills nga nje burim i verifikuar

# Kontejneri i sesionit s'ka akses te github.com — vetem raw.githubusercontent.
# Ndaj shkarkimi behet ketu, ku runner-i e ka aksesin e plote.
#
# KUJDES: nje skill eshte nje skedar INSTRUKSIONESH qe agjenti i ndjek. Instalimi
# eshte siperfaqe sulmi (prompt injection / exfiltrim sekretesh), ndaj:
#  - commit-i i burimit regjistrohet per gjurmueshmeri;
#  - cdo skedar skanohet per urdhera te dyshimte;
#  - skills tona ekzistuese nuk mbishkruhen kurre;
#  - rezultati kalon nga PR, jo push direkt.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo burim (owner/name)'
        required: true
        type: string
      subdir:
        description: 'Nendrejtoria ku te kerkohet ("." = krejt repoja)'
        required: false
        default: '.'
        type: string
      prefix:
        description: 'Prapashtese emri per te shmangur perplasje (bosh = pa prefiks)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SRC: ${{ inputs.repo }}
      SUB: ${{ inputs.subdir }}
      PREFIX: ${{ inputs.prefix }}
      BRANCH: skills/instalim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Shkarko burimin
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$SRC.git" /tmp/src
          echo "SRC_SHA=$(git -C /tmp/src rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf /tmp/src/.git
          echo "SKILL.md te gjetura:"
          find "/tmp/src/$SUB" -name SKILL.md | head -40

      - name: Skano per prompt-injection dhe kerkesa sekretesh
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          root = (pathlib.Path('/tmp/src') / os.environ['SUB']).resolve()

          RED = [
              (r'ignore (all |any )?previous instructions', 'anashkalim instruksionesh'),
              (r'disregard (the |your )?(system|previous)', 'anashkalim instruksionesh'),
              (r'service_role', 'çelës service_role'),
              (r'ANTHROPIC_API_KEY|OPENAI_API_KEY|GITHUB_TOKEN', 'emër sekreti'),
              (r'curl\s+[^|\n]*\|\s*(ba)?sh', 'curl | sh'),
              (r'base64\s+-d\s*\|', 'base64 -d | ...'),
              (r'~/\.ssh|id_rsa', 'çelësa SSH'),
          ]

          trees = {p.parent for p in root.rglob('SKILL.md')}
          hits, files = [], 0
          for t in sorted(trees):
              for p in sorted(t.rglob('*')):
                  if not p.is_file():
                      continue
                  files += 1
                  try:
                      txt = p.read_text(errors='replace')
                  except Exception:
                      continue
                  for pat, why in RED:
                      for m in re.finditer(pat, txt, re.I):
                          line = txt[:m.start()].count(chr(10)) + 1
                          hits.append(f"{p.relative_to(root)}:{line}  [{why}]  {m.group(0)!r}")

          print(f"U skanuan {files} skedare ne {len(trees)} skills.")
          if hits:
              print('::error::Modele te dyshimta — instalimi ndalohet:')
              for h in hits[:50]:
                  print('  ' + h)
              sys.exit(1)
          print('OK: asnje model i dyshimte.')
          PY

      - name: Kopjo pa mbishkruar asgje tonen
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil

          root = (pathlib.Path('/tmp/src') / os.environ['SUB']).resolve()
          repo = os.environ['SRC'].split('/')[-1]
          prefix = os.environ.get('PREFIX', '').strip()
          dst = pathlib.Path('.claude/skills')
          dst.mkdir(parents=True, exist_ok=True)

          existing = {d.name for d in dst.iterdir() if d.is_dir()}
          added, skipped, bad = [], [], []

          # Cdo SKILL.md eshte nje skill; emri vjen nga drejtoria prinderore,
          # ose nga vete repoja kur SKILL.md rri ne rrenje.
          for skill in sorted(root.rglob('SKILL.md')):
              d = skill.parent
              name = repo if d == root else d.name
              if prefix:
                  name = f"{prefix}-{name}"

              head = skill.read_text(errors='replace')[:2000]
              if not head.lstrip().startswith('---') or 'name:' not in head or 'description:' not in head:
                  bad.append(f"{name}: frontmatter i pavlefshem")
                  continue
              if name in existing:
                  skipped.append(name)
                  continue
              shutil.copytree(d, dst / name)
              existing.add(name)
              added.append(name)

          print(f"Shtuar ({len(added)}): {', '.join(added) or '-'}")
          print(f"Anashkaluar ({len(skipped)}): {', '.join(skipped) or '-'}")
          if bad:
              print('::warning::Anashkaluar si te keqformuara:')
              for b in bad:
                  print('  ' + b)
          if not added:
              print('::notice::Asgje e re per te shtuar.')
          PY

      - name: Shto gjurmen e burimit
        run: |
          F=.claude/skills/BURIMI.md
          [ -f "$F" ] || printf '# Burimet e skills-eve te importuara\n\nKeto skills NUK jane shkruar nga ne. Jane importuar te pandryshuara, pas\nskanimit per prompt-injection dhe kerkesa sekretesh, permes\n`.github/workflows/install-skills.yml`.\n\n| Repo | Commit | Nendrejtoria |\n|---|---|---|\n' > "$F"
          grep -q "$SRC_SHA" "$F" || printf '| `%s` | `%s` | `%s` |\n' "$SRC" "$SRC_SHA" "$SUB" >> "$F"

      - name: Dege + PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .claude/skills
          if git diff --cached --quiet; then
            echo "::notice::Asgje per te ndryshuar."
            exit 0
          fi
          # Dega e punes mbijeton merge-et. Pa e njohur gjendjen e saj ne remote,
          # --force-with-lease e refuzon push-in si "stale info".
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git commit -m "skills: importo nga $SRC @ ${SRC_SHA:0:7}" -m "Importuar te pandryshuara pas skanimit. Skills ekzistuese nuk u prekën. Gjurma: .claude/skills/BURIMI.md"
          git push -u --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "skills: importo nga $SRC" --body "Importim automatik nga \`$SRC\` @ \`$SRC_SHA\`, pas skanimit per prompt-injection." || echo "::notice::PR ekziston tashme."
