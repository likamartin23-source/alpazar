name: Pastro degët e bashkuara

# Fshin degë PUNE që kanë hyrë tashmë në `main`. I sigurt për squash-merge:
# `--merged` nuk vlen aty (SHA i ri pas squash-it).
#
# KRITERI: jo "a është dega identike me main" — ai ishte gabimi i versionit të
# parë, sepse degët mbajnë versione të vjetruara të skedarëve që main-i i ka
# ndryshuar më pas. Kriteri i saktë është KONTRIBUTI:
#   • skedarët që dega SHTOI (A) duhet të jenë në main me të njëjtin blob;
#   • skedarët që dega MODIFIKOI (M) mjafton të ekzistojnë — përmbajtja e tyre
#     ka evoluar më pas në main, çka është normale.
# Nëse qoftë edhe një skedar i shtuar mungon, dega RUHET.

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Prefikse degësh, të ndara me presje'
        required: true
        default: 'skills/,mcp/,ci/'
        type: string
      dry_run:
        description: 'Vetëm trego (pa fshirë)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  pastro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gjej dhe fshi
        env:
          PATTERN: ${{ inputs.pattern }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -u
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          MBROJTUR='main|master|claude/|feat/harmonize'
          fshira=0; ruajtura=0

          IFS=',' read -ra PREFS <<< "$PATTERN"
          for b in $(git branch -r --format='%(refname:short)' | sed 's|^origin/||' | sort -u); do
            match=no
            for p in "${PREFS[@]}"; do
              p="$(echo "$p" | xargs)"
              [ -n "$p" ] && case "$b" in "$p"*) match=yes ;; esac
            done
            [ "$match" = yes ] || continue
            echo "$b" | grep -qE "^($MBROJTUR)" && { echo "⛔ $b — e mbrojtur"; continue; }

            base=$(git merge-base origin/main "origin/$b" 2>/dev/null || echo "")
            if [ -z "$base" ]; then echo "🛡️ $b — RUHET (pa merge-base)"; ruajtura=$((ruajtura+1)); continue; fi

            mungon=0; shtuar=0
            while IFS=$'\t' read -r st path; do
              case "$st" in
                A*)
                  shtuar=$((shtuar+1))
                  bsha=$(git rev-parse "origin/$b:$path" 2>/dev/null || echo X)
                  msha=$(git rev-parse "origin/main:$path" 2>/dev/null || echo MUNGON)
                  if [ "$msha" != "$bsha" ]; then
                    mungon=$((mungon+1)); [ $mungon -le 3 ] && echo "     ✗ shtuar por s'është në main: $path"
                  fi ;;
                M*)
                  git cat-file -e "origin/main:$path" 2>/dev/null || {
                    mungon=$((mungon+1)); [ $mungon -le 3 ] && echo "     ✗ i modifikuar dhe mungon: $path"; } ;;
              esac
            done < <(git diff --name-status "$base" "origin/$b")

            if [ "$mungon" -eq 0 ]; then
              if [ "$DRY" = "true" ]; then
                echo "🔎 $b — do të fshihej ($shtuar skedarë të shtuar, të gjithë në main)"
              else
                git push -q origin --delete "$b" && echo "✅ $b — u fshi" || echo "❌ $b — dështoi"
              fi
              fshira=$((fshira+1))
            else
              echo "🛡️ $b — RUHET ($mungon kontribute s'janë në main)"
              ruajtura=$((ruajtura+1))
            fi
          done

          echo
          echo "── Përmbledhje: $fshira për fshirje · $ruajtura të ruajtura"
          [ "$DRY" = "true" ] && echo "::notice::dry_run=true — asgjë nuk u prek."
