name: AI Auto-Fix — rregullim automatik i gabimeve nga AI Health

# Mbyll ciklin e monitorimit: AI Health i REGJISTRON gabimet e prodhimit
# (health_events), ky workflow i LEXON dhe i JEP Claude Code-it që t'i rregullojë
# vetë, duke hapur një PR. Pa nderhyrje manuale.
#
# Trigger-at:
#  - schedule: çdo ditë 05:30 UTC (07:30 Tiranë) — pas auditimit ditor
#  - workflow_dispatch: manual, ose i thirrur nga jashtë me një problem konkret
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      problem:
        description: 'Problem konkret për t''u rregulluar (bosh = merr nga AI Health)'
        required: false
        type: string
      min_severity:
        description: 'Pragu minimal (low|medium|high)'
        required: false
        default: 'medium'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: ai-autofix
  cancel-in-progress: false

jobs:
  collect:
    name: Mblidh gabimet e pazgjidhura
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.fetch.outputs.problems }}
      has_work: ${{ steps.fetch.outputs.has_work }}
    steps:
      - id: fetch
        env:
          SB_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MANUAL: ${{ inputs.problem }}
          MIN_SEV: ${{ inputs.min_severity }}
        run: |
          set -euo pipefail

          # 1) Problem i dhënë manualisht ka përparësi.
          if [ -n "${MANUAL:-}" ]; then
            printf 'problems<<EOF\n%s\nEOF\n' "$MANUAL" >> "$GITHUB_OUTPUT"
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Përndryshe lexo nga AI Health. Kërkon service_role (health_events
          #    është RLS admin-only). Nëse sekreti mungon → dil pastër, mos dështo.
          if [ -z "${SB_URL:-}" ] || [ -z "${SB_SERVICE_KEY:-}" ]; then
            echo "::notice::Mungon NEXT_PUBLIC_SUPABASE_URL ose SUPABASE_SERVICE_ROLE_KEY — leximi automatik i AI Health u anashkalua. Workflow-i mund të thirret ende manualisht me input 'problem'."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          HTTP=$(curl -sS -w '%{http_code}' -o /tmp/ev.json \
            -H "apikey: $SB_SERVICE_KEY" \
            -H "Authorization: Bearer $SB_SERVICE_KEY" \
            "$SB_URL/rest/v1/health_events?select=id,message,url,source,level,severity,category,count,last_seen_at,status,likely_cause&status=in.(new,triaged)&last_seen_at=gte.$SINCE&order=count.desc&limit=15" || echo 000)

          if [ "$HTTP" != "200" ]; then
            echo "::warning::Leximi i health_events dështoi (HTTP $HTTP) — anashkalohet."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/ev.json'))))")
          if [ "$COUNT" = "0" ]; then
            echo "::notice::Asnjë gabim i pazgjidhur — asgjë për të rregulluar."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY' > /tmp/problems.txt
          import json
          evs = json.load(open('/tmp/ev.json'))
          for e in evs:
              print(f"- [{e.get('severity','?')}] x{e.get('count',1)} ({e.get('source','?')}/{e.get('category','?')}) {e.get('message','')}")
              if e.get('url'):
                  print(f"    URL: {e['url']}")
              if e.get('likely_cause'):
                  print(f"    Shkaku i dyshuar: {e['likely_cause']}")
          PY

          {
            echo 'problems<<EOF'
            cat /tmp/problems.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "has_work=true" >> "$GITHUB_OUTPUT"

  fix:
    name: Claude rregullon dhe hap PR
    needs: collect
    if: needs.collect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ALPAZAR_CLAUD_SECRET || secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.ALPAZAR_CLAUD_SECRET || secrets.GITHUB_TOKEN }}
          timeout_minutes: 25
          direct_prompt: |
            Ti je inxhinier i lartë në projektin Alpazar (Next.js 14 App Router + Supabase).
            AI Health ka regjistruar këto gabime REALE nga PRODHIMI:

            ${{ needs.collect.outputs.problems }}

            RREGULLA ABSOLUTE (mos i shkel kurrë):
            - CSS vetëm inline — JO Tailwind, JO librari komponentësh
            - Import paths vetëm relative — JO alias "@/"
            - Navigimi me window.location.href — JO useRouter()
            - OTP_SECONDS = 120 — MOS E NDRYSHO
            - Mos shto varësi npm të reja pa nevojë kritike
            - Gjuha e UI: shqip

            SI TË PUNOSH (metodë, jo hamendje):
            1. Për çdo gabim, GJEJ SHKAKUN RRËNJËSOR në kod përpara se të ndryshosh gjë.
               Mos e "fashit" simptomën.
            2. VERIFIKO se gabimi ekziston ende në kodin aktual — telemetria mund të
               jetë e vjetër dhe problemi tashmë i rregulluar. Nëse është i rregulluar,
               mos ndrysho asgjë dhe shpjegoje këtë në PR.
            3. Për React #418/#422/#425 (hydration): shkaktarët e zakonshëm janë
               Date.now(), Math.random(), dhe toLocaleString/toLocaleDateString
               (varen nga ICU/timezone → server ≠ klient). Përdor helper-at
               deterministikë te lib/format.ts.
            4. Për "Cannot read properties of null": shto guard, mos hiq funksionalitet.
            5. Pas ndryshimeve: `npx tsc --noEmit` DHE `npx next build` duhet të kalojnë.

            REZULTATI:
            Hap një Pull Request (MOS bëj push direkt në main) me:
            - titull të shkurtër që përshkruan fiksin
            - në përshkrim: për çdo gabim → shkaku rrënjësor, fiksi, dhe si u verifikua
            - nëse ndonjë gabim u vlerësua si i vjetër/i parregullueshëm, thuaje qartë

          allowed_tools: >
            Bash(npx tsc --noEmit),
            Bash(npx next build),
            Bash(npm ci),
            Bash(git *),
            Read,
            Edit,
            Write,
            Glob,
            Grep
