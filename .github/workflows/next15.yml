name: Migro ne Next 15

# Next 14 doli End-of-Life me 26 tetor 2025 dhe nuk merr me arna sigurie.
#
# Kodemodi eshte i njejti qe u xhirua dhe u verifikua lokalisht mbi te njejtin
# commit: build + `tsc --noEmit` + testet + nje smoke test i rrugeve dinamike.
# Ketu ri-xhirohet ne nje runner te paster qe `package-lock.json` te rilindi
# aty ku e pret `npm ci` i CI-se — lockfile-i eshte 287 KB dhe nuk kalon dot
# nga kontejneri i sesionit.
#
# Xhirohet nje here. Pas merge-it, ky skedar mund te fshihet.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Kodemodi — params behet Promise ne Next 15
        run: |
          python3 - <<'PY'
          import pathlib, sys, textwrap

          changed = []

          def edit(rel, pairs):
              p = pathlib.Path(rel)
              s = p.read_text()
              for old, new in pairs:
                  n = s.count(old)
                  if n != 1:
                      sys.exit(f"{rel}: pritej 1 perputhje, u gjeten {n}\n  {old[:90]!r}")
                  s = s.replace(old, new)
              p.write_text(s)
              changed.append(rel)

          # --- Server components + generateMetadata: `await props.params` -----
          # Funksionon njesoj ne Next 14 (await mbi objekt = objekti) dhe ne 15.
          edit('app/listing/[id]/page.tsx', [
           ("export async function generateMetadata({ params }: { params: { id: string } }): Promise<Metadata> {\n"
            "  const listing = await fetchListingData(params.id)",
            "export async function generateMetadata(props: { params: Promise<{ id: string }> }): Promise<Metadata> {\n"
            "  const params = await props.params\n"
            "  const listing = await fetchListingData(params.id)"),
           ("export default async function ListingPage({ params }: { params: { id: string } }) {\n"
            "  const listing = await fetchListingData(params.id)",
            "export default async function ListingPage(props: { params: Promise<{ id: string }> }) {\n"
            "  const params = await props.params\n"
            "  const listing = await fetchListingData(params.id)"),
          ])

          edit('app/kategori/[slug]/page.tsx', [
           ("export async function generateMetadata({ params }: { params: { slug: string } }): Promise<Metadata> {",
            "export async function generateMetadata(props: { params: Promise<{ slug: string }> }): Promise<Metadata> {\n"
            "  const params = await props.params"),
           ("export default async function CategoryPage({ params }: { params: { slug: string } }) {",
            "export default async function CategoryPage(props: { params: Promise<{ slug: string }> }) {\n"
            "  const params = await props.params"),
          ])

          edit('app/kategori/[slug]/[qytet]/page.tsx', [
           ("export async function generateMetadata(\n"
            "  { params }: { params: { slug: string; qytet: string } },\n"
            "): Promise<Metadata> {",
            "export async function generateMetadata(\n"
            "  props: { params: Promise<{ slug: string; qytet: string }> },\n"
            "): Promise<Metadata> {\n"
            "  const params = await props.params"),
           ("export default async function CategoryCityPage(\n"
            "  { params }: { params: { slug: string; qytet: string } },\n"
            ") {",
            "export default async function CategoryCityPage(\n"
            "  props: { params: Promise<{ slug: string; qytet: string }> },\n"
            ") {\n"
            "  const params = await props.params"),
          ])

          edit('app/biznese/[id]/page.tsx', [
           ("export async function generateMetadata({ params }: { params: { id: string } }): Promise<Metadata> {",
            "export async function generateMetadata(props: { params: Promise<{ id: string }> }): Promise<Metadata> {\n"
            "  const params = await props.params"),
           ("export default async function BiznesPage({ params }: { params: { id: string } }) {",
            "export default async function BiznesPage(props: { params: Promise<{ id: string }> }) {\n"
            "  const params = await props.params"),
          ])

          edit('app/u/[id]/page.tsx', [
           ("export async function generateMetadata({ params }: { params: { id: string } }): Promise<Metadata> {",
            "export async function generateMetadata(props: { params: Promise<{ id: string }> }): Promise<Metadata> {\n"
            "  const params = await props.params"),
           ("export default function UserProfilePage({ params }: { params: { id: string } }) {\n"
            "  return <UserProfileClient params={params} />",
            "export default async function UserProfilePage(props: { params: Promise<{ id: string }> }) {\n"
            "  const params = await props.params\n"
            "  return <UserProfileClient params={params} />"),
          ])

          # --- Faqe klient: `params` vjen si Promise, ndaj lexohet me hook -----
          edit('app/listing/[id]/edit/page.tsx', [
           ("import { useEffect, useState } from 'react'",
            "import { useEffect, useState } from 'react'\nimport { useParams } from 'next/navigation'"),
           ("export default function EditListing({ params }: { params: { id: string } }) {",
            "export default function EditListing() {\n"
            "  // Ne Next 15 nje faqe klient e merr `params` si Promise. Hook-u e jep\n"
            "  // sinkron dhe punon njesoj ne 14 e ne 15.\n"
            "  const params = useParams() as { id: string }"),
          ])

          edit('app/biznese/[id]/edit/page.tsx', [
           ("import { useState, useEffect } from 'react'",
            "import { useState, useEffect } from 'react'\nimport { useParams } from 'next/navigation'"),
           ("export default function BiznesEditPage({ params }: { params: { id: string } }) {",
            "export default function BiznesEditPage() {\n"
            "  // Ne Next 15 nje faqe klient e merr `params` si Promise. Hook-u e jep\n"
            "  // sinkron dhe punon njesoj ne 14 e ne 15.\n"
            "  const params = useParams() as { id: string }"),
          ])

          # --- `ssr: false` nuk lejohet me ne nje Server Component ------------
          chrome = textwrap.dedent('''\
              'use client'

              // Next 15 nuk e lejon `ssr: false` te `next/dynamic` brenda nje Server
              // Component, dhe `app/layout.tsx` eshte server. Ndaj keto ngarkime rrine
              // ketu, ne nje modul klient. Sjellja mbetet e njejta si me pare:
              // komponentet ngarkohen vetem ne shfletues, jo gjate renderimit ne server.
              //
              // Te gjithe keta komponente jane vete 'use client'; `ssr: false` sherben
              // qe te mos dalin fare ne HTML-ne e serverit (banderola mirembajtjeje,
              // njoftime, pelqimi i cookie-ve — asnje prej tyre s'ka kuptim para
              // hidratimit).

              import dynamic from 'next/dynamic'

              export const AiFloat = dynamic(
                () => import('./AiFloat'),
                { ssr: false },
              )

              export const UpdatePrompt = dynamic(
                () => import('./UpdatePrompt'),
                { ssr: false },
              )

              export const NotificationToast = dynamic(
                () => import('./NotificationToast').then(m => ({ default: m.NotificationToast })),
                { ssr: false },
              )

              export const MaintenanceBanner = dynamic(
                () => import('./MaintenanceBanner').then(m => ({ default: m.MaintenanceBanner })),
                { ssr: false },
              )

              export const AnnouncementBar = dynamic(
                () => import('./MaintenanceBanner').then(m => ({ default: m.AnnouncementBar })),
                { ssr: false },
              )

              export const CookieBanner = dynamic(
                () => import('./CookieBanner').then(m => ({ default: m.CookieBanner })),
                { ssr: false },
              )
              ''')
          pathlib.Path('app/components/ChromeClient.tsx').write_text(chrome)
          changed.append('app/components/ChromeClient.tsx')

          edit('app/layout.tsx', [
           ("const AiFloat               = dynamic(() => import('./components/AiFloat'),            { ssr: false })\n"
            "const UpdatePrompt          = dynamic(() => import('./components/UpdatePrompt'),       { ssr: false })\n"
            "const AlpazarProviderDyn    = dynamic(() => import('../lib/context').then(m => ({ default: m.AlpazarProvider })))\n"
            "const NotificationToast     = dynamic(() => import('./components/NotificationToast').then(m => ({ default: m.NotificationToast })), { ssr: false })\n"
            "const MaintenanceBanner     = dynamic(() => import('./components/MaintenanceBanner').then(m => ({ default: m.MaintenanceBanner })), { ssr: false })\n"
            "const AnnouncementBar       = dynamic(() => import('./components/MaintenanceBanner').then(m => ({ default: m.AnnouncementBar })), { ssr: false })\n"
            "const GlobalErrorBoundaryDyn = dynamic(() => import('../lib/error-handler').then(m => ({ default: m.GlobalErrorBoundary })))\n"
            "const CookieBannerDyn        = dynamic(() => import('./components/CookieBanner').then(m => ({ default: m.CookieBanner })), { ssr: false })\n"
            "const AgeGateDyn             = dynamic(() => import('./components/AgeGate').then(m => ({ default: m.AgeGate })))",
            "// `ssr: false` nuk lejohet ne nje Server Component (Next 15) — keto rrine te\n"
            "// ./components/ChromeClient, qe eshte modul klient. Sjellja s'ndryshon.\n"
            "const AlpazarProviderDyn     = dynamic(() => import('../lib/context').then(m => ({ default: m.AlpazarProvider })))\n"
            "const GlobalErrorBoundaryDyn = dynamic(() => import('../lib/error-handler').then(m => ({ default: m.GlobalErrorBoundary })))\n"
            "const AgeGateDyn             = dynamic(() => import('./components/AgeGate').then(m => ({ default: m.AgeGate })))"),
           ("import { SiteFooter } from './components/SiteFooter'",
            "import { SiteFooter } from './components/SiteFooter'\n"
            "import {\n"
            "  AiFloat, UpdatePrompt, NotificationToast,\n"
            "  MaintenanceBanner, AnnouncementBar,\n"
            "  CookieBanner as CookieBannerDyn,\n"
            "} from './components/ChromeClient'"),
          ])

          # --- Sentry: hook-u i ri per gabimet ne server ----------------------
          instr = textwrap.dedent('''\
              import * as Sentry from '@sentry/nextjs'

              export async function register() {
                if (process.env.NEXT_RUNTIME === 'nodejs') {
                  await import('./sentry.server.config')
                }
                if (process.env.NEXT_RUNTIME === 'edge') {
                  await import('./sentry.edge.config')
                }
              }

              // Next 15 e thirr kete per cdo gabim ne server, perfshire ata brenda React
              // Server Components te ndera — te cilet nuk kalojne nga error boundary-t.
              // Pa te, Sentry i humbte fare (paralajmerim ne build: "Could not find
              // `onRequestError` hook").
              export const onRequestError = Sentry.captureRequestError
              ''')
          pathlib.Path('instrumentation.ts').write_text(instr)
          changed.append('instrumentation.ts')

          print('Skedaret e prekur:')
          for c in changed:
              print(' ', c)
          PY

      - name: Instalo Next 15
        run: npm install next@^15.5.23 --no-audit --no-fund

      - name: Kontroll tipesh
        run: npx tsc --noEmit

      - name: Teste njesie
        run: npm run test

      - name: Ndertim
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://sopafwfkrxpcdaljddoh.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}

      - name: Dege
        env:
          BRANCH: next15/${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Kodemodi nuk ndryshoi asgje — main mund te jete migruar tashme."
            exit 1
          fi
          git checkout -b "$BRANCH"
          git commit -m "Next 14 -> 15: params si Promise, ssr:false jashte layout-it, onRequestError" \
                     -m "Next 14 doli EOL me 26 tetor 2025. Verifikuar: tsc --noEmit, teste, build, dhe smoke test i rrugeve dinamike."
          git push -u origin "$BRANCH"
          echo "::notice::Hape PR-ne: https://github.com/${{ github.repository }}/compare/main...$BRANCH"
